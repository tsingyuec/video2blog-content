# MkDocs Material 站点配置
# 构建前需先运行 `python scripts/build_site.py` 生成 build/docs 与 build/nav.yml。
# 本地预览：python scripts/build_site.py && mkdocs serve
#
# 导航（nav）由 scripts/build_site.py 依据各页一级标题自动生成到 build/nav.yml，
# 这里通过 INHERIT 合并进来；若要手工调整顺序/名称，改脚本里的 PRIORITY / DIR_LABELS。
INHERIT: build/nav.yml

site_name: 视频图文博客库
site_description: 把 Bilibili / YouTube 视频整理成「图文博客」的合集
site_url: https://tsingyuec.github.io/video2blog-content/
repo_url: https://github.com/tsingyuec/video2blog-content
repo_name: tsingyuec/video2blog-content
edit_uri: ""

docs_dir: build/docs
site_dir: build/site
use_directory_urls: false

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/bookshelf
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    # 浅色：白底 + 红色强调（OI Wiki 风格）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色：蓝色主色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search:
      lang: zh

extra_css:
  - _static/extra.css

extra_javascript:
  - _static/extra.js

extra:
  generator: false

copyright: 内容由 video2blog skill 生成
