name: Build and Deploy Site

# 每次推送到 main 自动重建并发布 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的提交会取消排队中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Assemble docs (content/ -> build/docs)
        run: python scripts/build_site.py

      - name: Build site
        run: mkdocs build

      - name: Report site size
        run: du -sh build/site

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
